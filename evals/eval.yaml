schema_version: v1alpha1

# omnisub 的评测套件（skill-upper 生成）。
# 设计取舍：五条用例全部【不联网、不下载、不写宿主日志】，只验 Skill 的契约面——
# 路由判断、解析规则、守卫条件、输出模板，以及本地视频字幕分支的复用优先级与显式参数权威性。
# 真实抓取链路由人工冒烟覆盖，不放进 CI 门禁（Douyin 风控 + cookie 时效 + ASR 计费会让它变 flaky）。

environment:
  type: none

mcp:
  servers: []

skills:
  - source: local_path
    # 相对 Skill 根目录（SKILL.md 所在目录）
    path: .
    # 安装到 workspace 内的 .dsh-skills/omnisub，供被测 DSH 读取
    target: .dsh-skills/omnisub

engine:
  name: deepseek-harness
  model:
    provider: dashscope
    name: qwen3.8-max
  custom:
    transport: local
    conversation_mode: stateful
    response_format: session_result
    # 300s 会让"先读脚本 + 读 SKILL.md，再执行"的重用例跑不完：实测 video-source-artifact-guard
    # 在 iteration-3/5 两次被 295s 切断（不是断言失败）。给足探索预算。
    timeout_seconds: 600
    env:
      # ${api_key} 由 skill-up 凭据链解析（~/.skill-up/credentials.yaml），密钥不落 YAML
      DSH_API_KEY: ${api_key}
      # **必须与凭据里的 key 同域**：~/.skill-up/credentials.yaml 的 key 是 token-plan 的
      # （sk-sp-…），只在 token-plan.cn-beijing.maas.aliyuncs.com 有效；指向 dashscope.aliyuncs.com
      # 会 6/6 全 401（实测 iteration-9）。留出外层覆盖口，换回 dashscope key 时设 DSH_BASE_URL 即可。
      DSH_BASE_URL: ${DSH_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      DSH_MODEL: ${model_name}
      # 绝对路径：被测宿主 PATH 可能极简，按名找不到二进制
      DSH_BIN: ${SKILLUP_DSH_BIN:-/Users/yangzhuo/.local/share/skill-up-dsh/dsh}
      DSH_SKILLS_DIR: ${workspace}/.dsh-skills
      DSH_TELEMETRY_MODE: DISABLED
      DSH_PERMISSION_MODE: danger-full-access
    local:
      # Python 3.12+；用绝对路径（uv 托管 3.12.9 在 ~/.local/bin/python3）
      command: ${SKILLUP_PYTHON:-/Users/yangzhuo/.local/bin/python3}
      args:
        - ${SKILLUP_DIR:-/Users/yangzhuo/.local/share/skill-up-dsh}/dsh_runner.py
        - --input
        - ${input_file}
        - --output
        - ${output_file}
      cwd: ${workspace}
      input_file: .skill-up-dsh/input.json
      output_file: .skill-up-dsh/result.json

cases:
  files:
    - evals/cases/triage-video-share-page.yaml
    - evals/cases/cookie-invalid-guard.yaml
    - evals/cases/summary-output-format.yaml
    - evals/cases/video-embedded-subtitle-reuse.yaml
    - evals/cases/video-source-artifact-guard.yaml
    - evals/cases/video-bilingual-ass-contract.yaml
    - evals/cases/douyin-degraded-download-guard.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 8
  parallelism: 1

judge:
  type: rule_based

report:
  formats: [json, html]
  artifacts: [transcript, logs]
